name: CI Pipeline — Production Hardening & Verification Gate

on:
  push:
    branches: [ main, final-integration, "feat/*", "chore/*" ]
  pull_request:
    branches: [ main, final-integration ]

jobs:
  backend-and-ml:
    name: Backend Test Suite & ML Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-work/requirements.txt
          pip install pytest httpx

      - name: Initialize Reference Database for CI
        run: |
          cd backend-work
          python -m app.seed
        env:
          DATABASE_URL: sqlite:///./charter.db

      - name: Run Backend Pytest Suite
        run: |
          cd backend-work
          python -m pytest -q
        env:
          DATABASE_URL: sqlite:///./charter.db

      - name: Run System Production Verification Gate
        run: |
          python scripts/verify_production.py
        env:
          DATABASE_URL: sqlite:///./backend-work/charter.db

  frontend:
    name: Frontend Build & Asset Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-work/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend-work
          npm ci

      - name: Build Production Frontend
        run: |
          cd frontend-work
          npm run build

  docker-syntax:
    name: Docker & Docker Compose Configuration Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
